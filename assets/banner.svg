<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Shruti Singh - Full-Stack builder. 150+ merged PRs, hackathon winner, 2x national finalist." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E0A4A">
        <animate attributeName="stop-color" values="#1E0A4A;#3B1587;#1E0A4A" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#6D28D9">
        <animate attributeName="stop-color" values="#6D28D9;#A21CAF;#6D28D9" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#DB2777">
        <animate attributeName="stop-color" values="#DB2777;#7C3AED;#DB2777" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F5D0FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round">
      <rect width="1000" height="340" rx="28"/>
    </clipPath>
    <clipPath id="typed">
      <rect x="60" y="262" height="50" width="0">
        <animate attributeName="width" values="0;0;250;250;250" keyTimes="0;0.08;0.5;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <rect width="1000" height="340" fill="url(#grid)"/>

    <!-- light orbs -->
    <circle cx="140" cy="70" r="100" fill="#E879F9" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="140;320;140" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;140;70" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="280" r="120" fill="#F472B6" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="860;700;860" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#FFFFFF">
      <circle cx="520" cy="40" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="300" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="40" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="300" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="310" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- orbit rings -->
    <g transform="translate(850 170)" fill="none" stroke="#FFFFFF">
      <circle r="46" stroke-opacity="0.7" stroke-width="2" filter="url(#glow)"/>
      <circle r="86" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="126" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="2 12">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="36s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <circle cx="86" cy="0" r="8" fill="#F0ABFC" stroke="none" filter="url(#glow)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="15s" repeatCount="indefinite"/>
        <circle cx="126" cy="0" r="6" fill="#FFFFFF" stroke="none" filter="url(#glow)"/>
      </g>
      <text x="0" y="10" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#FFFFFF" stroke="none" filter="url(#glow)">&lt;/&gt;</text>
    </g>

    <!-- floating code glyphs -->
    <g font-family="Consolas, 'Courier New', monospace" fill="#FFFFFF" fill-opacity="0.2" font-size="30">
      <text x="610" y="90">{ }
        <animate attributeName="y" values="90;76;90" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="650" y="290">=&gt;
        <animate attributeName="y" values="290;276;290" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- tag line above name -->
    <text x="62" y="62" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#F0ABFC" letter-spacing="3">HELLO, WORLD. I'M</text>

    <!-- name + tagline -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="58" y="136" font-size="76" font-weight="900" fill="url(#nameFill)" filter="url(#glow)">Shruti Singh
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="62" y="180" font-size="25" fill="#F5D0FE">Full-Stack builder · AI-curious · Open-source regular
        <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1.2s" fill="freeze"/>
      </text>
    </g>

    <!-- achievement chips -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">
      <rect x="60" y="204" width="186" height="38" rx="19" fill="#0B0618" fill-opacity="0.5" stroke="#F0ABFC" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="78" y="228" textLength="150" lengthAdjust="spacing">150+ MERGED PRs</text>

      <rect x="258" y="204" width="206" height="38" rx="19" fill="#0B0618" fill-opacity="0.5" stroke="#F0ABFC" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="276" y="228" textLength="170" lengthAdjust="spacing">1× HACKATHON WINNER</text>

      <rect x="476" y="204" width="222" height="38" rx="19" fill="#0B0618" fill-opacity="0.5" stroke="#F0ABFC" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <text x="494" y="228" textLength="186" lengthAdjust="spacing">2× HACKATHON FINALIST</text>
    </g>

    <!-- terminal pill -->
    <rect x="60" y="262" width="400" height="52" rx="14" fill="#0B0618" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="80" cy="278" r="4" fill="#F472B6"/>
    <circle cx="94" cy="278" r="4" fill="#FBBF24"/>
    <circle cx="108" cy="278" r="4" fill="#A3E635"/>
    <g clip-path="url(#typed)">
      <text x="76" y="302" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#E9D5FF">$ npm run ship-ideas</text>
    </g>
    <rect x="76" y="287" width="10" height="20" fill="#F0ABFC" opacity="0">
      <animate attributeName="x" values="76;76;306;306;306" keyTimes="0;0.08;0.5;0.92;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1;0;1;0;1;0" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
