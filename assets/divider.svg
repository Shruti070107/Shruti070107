<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#fade)"/>
  <circle cy="12" r="5" fill="#F0ABFC" filter="url(#glow)">
    <animate attributeName="cx" values="0;1000" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <rect x="494" y="6" width="12" height="12" rx="2" fill="#0B0618" stroke="#E879F9" stroke-width="2" transform="rotate(45 500 12)"/>
</svg>
